# This config demonstrates native histograms (experimental): distributions
# where you don't configure bucket bounds, and only the buckets that have
# samples are stored and exported.
#
# Prometheus gets native histograms only if it scrapes cloudprober with
# scrape_native_histograms set (Prometheus 3.8 or later):
#
#   scrape_configs:
#     - job_name: cloudprober
#       scrape_native_histograms: true
#       static_configs:
#         - targets: ["localhost:9313"]
#
# And then, 95th percentile latency is:
#
#   histogram_quantile(0.95, sum by (probe, dst) (rate(latency_dist[5m])))
#
# See https://cloudprober.org/docs/how-to/percentiles/#native-histograms for
# more details.

probe {
  name: "homepage"
  type: HTTP
  targets {
    host_names: "www.google.com,www.wikipedia.org"
  }

  latency_unit: "ms"
  latency_distribution {
    # Default schema is 3: each bucket is about 9% wide. Use a higher schema
    # (up to 8) for narrower buckets:
    #   native_buckets { schema: 5 }
    native_buckets {}
  }

  # Use a different name for the latency metric here, as the probe below
  # exports latency as a number. Otherwise, "latency" will be a histogram for
  # this probe and a number for the other one.
  latency_metric_name: "latency_dist"
}

# Latency is not a distribution for this probe.
probe {
  name: "dns"
  type: DNS
  targets {
    host_names: "8.8.8.8"
  }
}
