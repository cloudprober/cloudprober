sonar.projectKey=cloudprober_cloudprober
sonar.projectName=Cloudprober

sonar.go.file.suffixes=.go
sonar.go.exclusions=**/vendor/**

sonar.sources=.
sonar.exclusions=**/*_test.go,examples/**,**.pb.go,**/test_*.py,**_pb*.py
sonar.coverage.exclusions=examples/**,**.pb.go, **/cmd/*.go,**/test_*.py,**_pb*.py,**/internal/testcerts/**,probes/browser/testdata/reporter_decision_harness.mjs

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.issues.ignore.multicriteria=e1,e3,e4
sonar.issues.ignore.multicriteria.e1.ruleKey=go:S(1313|1186|1192|3776)
sonar.issues.ignore.multicriteria.e1.resourceKey=**_test.go
sonar.issues.ignore.multicriteria.e3.ruleKey=secrets:S6652
sonar.issues.ignore.multicriteria.e3.resourceKey=**_test.go
# S8707 flags CLI arguments reaching the filesystem, aimed at agent-executed code
# handling untrusted input. build_logo.py is a developer build tool run by hand
# from a checkout: --out is the operator's own choice of output directory, and
# every filename joined onto it is a hardcoded literal, so nothing untrusted is
# ever concatenated into a path.
sonar.issues.ignore.multicriteria.e4.ruleKey=pythonsecurity:S8707
sonar.issues.ignore.multicriteria.e4.resourceKey=tools/logogen/build_logo.py

sonar.go.tests.reportPaths=report.json
sonar.go.coverage.reportPaths=cover.out
sonar.host.url=https://sonarcloud.io
sonar.organization=cloudprober
