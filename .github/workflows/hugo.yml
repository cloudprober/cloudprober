name: Build and deploy gh-pages

on:
  push:
    branches:
      - main
      - browser_dev
      - docs_test/**
    paths:
      - 'docs/**'
      - '**proto/*.proto'
      - '.github/workflows/hugo.yml'
      - 'tools/gen_config_docs.sh'
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
          # Not worth caching for a docs build, and it would otherwise compete
          # to populate the Go cache key that go.yml's build-and-test needs.
          cache: false
        id: go

      - name: Setup public worktree
        run: cd docs && git worktree add public gh-pages

      - name: Create a branch for pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/public
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin --delete gh-pages-github-action || true
          git checkout -b gh-pages-github-action gh-pages

      - name: Generate config docs
        # The bare call generates docs for the current branch (config/main/).
        # The 'latest' call regenerates config/latest/ and the non-versioned
        # config/ pages, which are otherwise absent from the content tree on a
        # docs push, and so drop out of the sitemap, RSS and search index that
        # Hugo rebuilds from content. Output is derived from the latest release
        # tarball, so it is identical between runs.
        run: |
          tools/gen_config_docs.sh
          tools/gen_config_docs.sh latest

      - name: Build pages
        run: |
          cd docs
          npm ci
          npm run build
          ls public
          cd public && git status

      - name: Clean stale assets
        # Hugo keeps fingerprinted assets it no longer emits, so stale
        # bundles accumulate in the branch. Drop the ones no page in the
        # rebuilt tree references; the versioned config docs, which are not
        # rebuilt on every run, keep the bundles they still reference.
        run: tools/clean_stale_assets.sh docs/public

      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/public
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add --all
          git status
          git diff-index --quiet HEAD || git commit -m "Update gh-pages" && git push --set-upstream origin gh-pages-github-action
