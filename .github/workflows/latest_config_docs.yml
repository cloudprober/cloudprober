name: Build config docs for release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to run workflow for"
        default: "latest"
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
          # Not worth caching for a docs build, and it would otherwise compete
          # to populate the Go cache key that go.yml's build-and-test needs.
          cache: false
        id: go

      - name: Setup public worktree
        run: cd docs && git worktree add public gh-pages

      - name: Create a branch for pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/public
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push origin --delete gh-pages-github-action || true
          git checkout -b gh-pages-github-action gh-pages

      - name: Generate config docs for latest
        if: ${{ github.event_name == 'release'}}
        run: |
          tools/gen_config_docs.sh
          tools/gen_config_docs.sh latest

      - name: Generate config docs for latest (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != 'all'
        run: tools/gen_config_docs.sh ${{ github.event.inputs.tag }}

      - name: Generate config docs for latest (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag == 'all'
        run: |
          # Versions already published to gh-pages.
          existing=$(for dir in docs/public/docs/config/v*.*.*; do
            [ -d "$dir" ] && basename "$dir"
          done | sort -V)
          min_version=$(echo "$existing" | head -1)
          # Union with release tags so newly-released versions are picked up,
          # filtered to versions >= the oldest already-published one.
          versions=$( (echo "$existing"; git tag --list 'v*.*.*') | sort -uV |
            awk -v min="$min_version" '$0==min{seen=1} seen')
          for version in $versions
          do
            echo "Generating config docs for $version"
            tools/gen_config_docs.sh $version
          done
          echo "Generating config docs for latest"
          tools/gen_config_docs.sh latest

      - name: Build pages
        run: |
          cd docs
          npm ci
          npm run build
          ls public
          cd public && git status

      - name: Clean stale assets
        # Hugo keeps fingerprinted assets it no longer emits, so stale
        # bundles accumulate in the branch. Drop the ones no page in the
        # rebuilt tree references; the versioned config docs, which are not
        # rebuilt on every run, keep the bundles they still reference.
        run: tools/clean_stale_assets.sh docs/public

      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/public
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add --all
          git status
          git diff-index --quiet HEAD || git commit -m "Update gh-pages" && git push --set-upstream origin gh-pages-github-action
