name: Go Build and Test
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".github/workflows/hugo.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/workflows/hugo.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to run workflow for"
        required: true
  release:
    types: [published]

concurrency:
  # Only pull requests are collapsed, so that a new push supersedes the run in
  # flight. Everything else gets a group of its own: GitHub keeps just one
  # pending run per group, so sharing one would let a burst of pushes to main
  # cancel a queued workflow_dispatch or an intermediate release build.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    env:
      PING_HOSTS_V4: 127.0.1.1,localhost
      PING_HOSTS_V6: localhost
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Race detection is covered by the ubuntu and macos jobs; skipping it
          # on windows, where it's the slowest, keeps the job off the critical
          # path.
          - os: windows-latest
            race_flag: ""
          - os: macos-latest
            race_flag: "-race"
            # The race detector sleeps 1s at exit by default (TSAN's
            # atexit_sleep_ms), which adds up across the ~130 test binaries.
            # That sleep is what lets it catch races on the shutdown path, so
            # macos is now weaker at those, not just faster. ubuntu keeps the
            # default and stays the thorough one.
            gorace: "atexit_sleep_ms=0"
    steps:
      - name: Check out code into the Go module directory
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Check out code into the Go module directory
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Go env vars on Windows
        if: matrix.os == 'windows-latest'
        run: |
          echo "GOCACHE=D:\gocache" >> $env:GITHUB_ENV
          echo "GOMODCACHE=D:\gomodcache" >> $env:GITHUB_ENV
          echo "GOTMPDIR=D:\gotmp" >> $env:GITHUB_ENV
          mkdir D:\gotmp

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
        id: go

      - name: Set DISABLE_IPV6_TESTS on Windows OS
        if: matrix.os == 'windows-latest'
        run: echo "DISABLE_IPV6_TESTS=yes" >> $env:GITHUB_ENV

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Set up ubuntu for testing
        if: matrix.os == 'ubuntu-latest'
        run: sudo sudo sysctl -w net.ipv4.ping_group_range="0 500000"

      - name: Test on ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          gotestsum --jsonfile=report.json --rerun-fails --packages=./... -- ${{ env.EXTRA_TEST_FLAGS }} -race -covermode=atomic -coverprofile=cover.out

      - name: Test on non-ubuntu
        if: matrix.os != 'ubuntu-latest'
        env:
          GORACE: ${{ matrix.gorace }}
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          gotestsum --rerun-fails --packages=./... -- ${{ env.EXTRA_TEST_FLAGS }} ${{ matrix.race_flag }}

      - name: Privileged ping tests.
        if: matrix.os != 'windows-latest'
        run: |
          go test github.com/cloudprober/cloudprober/probes/ping -c
          sudo PING_HOSTS_V4=${{ env.PING_HOSTS_V4 }} PING_HOSTS_V6=${{ env.PING_HOSTS_V6 }} ./ping.test -test.v -test.run ^TestRunProbeRealICMP$

      - name: Example config tests
        if: matrix.os == 'ubuntu-latest'
        run: tools/test_example_configs.sh

      - name: Upload test and coverage reports
        # Upload even when an earlier step failed, so that a failing run still
        # gets analyzed. gotestsum and -coverprofile write these files whether
        # or not the tests pass.
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            report.json
            cover.out

  sonarcloud:
    name: SonarCloud Scan
    needs: [build-and-test]
    # As a step in build-and-test, this used to run whenever the ubuntu tests
    # passed, regardless of the other legs. needs: can only wait on a whole
    # job, so don't gate on its success -- gate on the reports being there
    # instead, which is what the scan actually needs.
    if: |
      !cancelled() &&
      github.repository == 'cloudprober/cloudprober' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      # This job only runs for push and same-repo pull_request events, so it
      # doesn't need the workflow_dispatch checkout the other jobs have.
      - name: Check out code into the Go module directory
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Download test and coverage reports
        id: reports
        # If build-and-test died before producing them, there is nothing to
        # scan; skip rather than fail and add a second red check.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: test-reports

      - name: SonarCloud Scan
        if: steps.reports.outcome == 'success'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-binaries:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out code into the Go module directory
        if: ${{ !contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Check out code into the Go module directory
        if: ${{ contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # This job builds through the Makefile (CGO_ENABLED=0 cross
          # compiles), whose artifacts share nothing with a normal build. Keep
          # it on its own cache key, so that it doesn't win the race to
          # populate the key build-and-test needs.
          cache-dependency-path: |
            go.sum
            Makefile
        id: go

      - run: make cloudprober-linux-{amd64,arm64,armv7}
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - run: make cloudprober-macos-{amd64,arm64} cloudprober-windows-amd64
        if: ${{ matrix.os == 'macos-latest' }}

      - name: Upload cloudprober dist
        uses: actions/upload-artifact@v4
        with:
          name: cloudprober-${{ matrix.os }}-dist
          path: cloudprober-*


  build-fips-binaries:
    name: Build fips binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            distname: linux-amd64
          - os: ubuntu-24.04-arm
            distname: linux-arm64
    steps:
      - name: Check out code into the Go module directory
        if: ${{ !contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Check out code into the Go module directory
        if: ${{ contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # This job's GOCACHE is built with GOEXPERIMENT=boringcrypto and is
          # useless to every other job, so it doesn't share a cache key with
          # them. Caching it separately isn't worth it either: the module
          # download is only a few seconds, and the boringcrypto build gets
          # recompiled regardless.
          cache: false
        id: go

      - run: make cloudprober-fips && mv cloudprober-fips cloudprober-fips-${{ matrix.distname }}

      - name: Upload cloudprober dist
        uses: actions/upload-artifact@v4
        with:
          name: cloudprober-fips-${{ matrix.distname }}-dist
          path: cloudprober-*
        
  build-dist:
    name: Build cloudprober release
    if: github.event_name != 'pull_request'
    needs: [build-and-test, build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        if: ${{ !contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Check out code into the Go module directory
        if: ${{ contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Download ubuntu cloudprober binaries
        uses: actions/download-artifact@v4
        with:
          name: cloudprober-ubuntu-latest-dist

      - name: Download macos cloudprober binaries
        uses: actions/download-artifact@v4
        with:
          name: cloudprober-macos-latest-dist

      - run: make dist

      - name: Upload cloudprober release
        uses: actions/upload-artifact@v4
        with:
          name: cloudprober-release-binaries
          path: |
            cloudprober-*.zip
            cloudprober-*.tar.gz
            cloudprober-*-checksums.txt

  build_and_push_docker_multiarch:
    name: Build and push multiarch docker image
    if: |
      github.repository == 'cloudprober/cloudprober' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-and-test, build-binaries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_type: [regular, fips, playwright]

    steps:
      - name: Check out code into the Go module directory
        if: ${{ !contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Check out code into the Go module directory
        if: ${{ contains(github.event_name, 'workflow_dispatch') }}
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Download cloudprober binary
        uses: actions/download-artifact@v4
        with:
          name: cloudprober-ubuntu-latest-dist

      - name: Download fips cloudprober amd64 binary
        if: ${{ matrix.image_type == 'fips' }}
        uses: actions/download-artifact@v4
        with:
          name: cloudprober-fips-linux-amd64-dist

      - name: Download fips cloudprober arm64 binary
        if: ${{ matrix.image_type == 'fips' }}
        uses: actions/download-artifact@v4
        with:
          name: cloudprober-fips-linux-arm64-dist
  
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.docker_login }}
          password: ${{ secrets.docker_pass }}

      - name: Login to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          cp cloudprober-linux-amd64 cloudprober
          ls -R cloudprober*
          chmod a+rx cloudprober cloudprober-*

      - name: Build and push release Docker Image (main)
        if: ${{ matrix.image_type == 'regular' }}
        run: |
          make docker_multiarch
          make docker_multiarch DOCKER_IMAGE=ghcr.io/cloudprober/cloudprober

      - name: Build and push release Docker Image (contrib)
        if: ${{ matrix.image_type == 'regular' }}
        run: |
          make -C contrib docker_multiarch
          make -C contrib docker_multiarch DOCKER_IMAGE=ghcr.io/cloudprober/cloudprober-contrib

      - name: Build and push release Docker Image (main)
        if: ${{ matrix.image_type == 'fips' }}
        run: |
          make docker_multiarch_fips
          make docker_multiarch_fips DOCKER_IMAGE=ghcr.io/cloudprober/cloudprober

      - name: Build and push release Docker Image
        if: ${{ matrix.image_type == 'playwright' }}
        run: |
          make docker_multiarch_pw
          make docker_multiarch_pw DOCKER_IMAGE=ghcr.io/cloudprober/cloudprober

  pre-release:
    name: Upload pre-release binaries
    if: github.ref == 'refs/heads/main'
    needs: [build-dist]
    runs-on: ubuntu-latest

    steps:
      - name: Download cloudprober release
        uses: actions/download-artifact@v4
        with:
          name: cloudprober-release-binaries
      - run: ls -R *
      # Rename the versioned archives to "tip" ones, and regenerate checksums
      # for the renamed files (the shipped checksums.txt refers to the
      # versioned names).
      - run: |
          rm -f cloudprober-*-checksums.txt
          for f in cloudprober-*; do
            tip=$(echo "$f" | sed -E 's/^cloudprober-.*-(linux|macos|windows)-/cloudprober-tip-\1-/')
            if [[ "$tip" == "$f" ]]; then
              echo "Unexpected release artifact, can't derive a tip name: $f" >&2
              exit 1
            fi
            mv "$f" "$tip"
          done
          sha256sum cloudprober-tip-*.zip cloudprober-tip-*.tar.gz \
            > cloudprober-tip-checksums.txt
      - uses: pyTooling/Actions/releaser@r0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            cloudprober-tip-*
